server:
  port: 8055

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org:
      springframework:
        cloud:
          gateway: TRACE
          gateway.route.RouteDefinitionRouteLocator: INFO
    root: INFO


spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedHeaders: "*"
            allowedMethods:
              - GET
              - POST
      routes:
        - id: discovery-server
          filters:
            - SetPath=/
          predicates:
            - Path=/eureka/web
          uri: http://localhost:8761
        - id: discovery-server-static
          predicates:
            - Path=/eureka/**
          uri: http://localhost:8761
        - id: course-service
          predicates:
            - Path=/api/v1/course/**
          uri: lb://course-service
        - id: auth-service
          predicates:
            - Path=/api/Auth/**
          uri: lb://user-service
        - id: user-service
          predicates:
            - Path=/api/v1/user/**
          uri: lb://user-service
        - id: email-service
          predicates:
            - Path=/api/v1/email/**
          uri: lb://email-service
        - id: file-service
          predicates:
            - Path=/api/v1/file/**
          uri: lb://file-service

        - id: chat-service
          predicates:
            - Path=/api/v1/chat/**
          uri: lb://chat-service
