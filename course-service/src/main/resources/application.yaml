server:
  port: 8084

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    org:
      springframework: ERROR

spring:
  application:
    name: course-service

  data:
    mongodb:

      username: admin
      password: admin
      authentication-database: admin
      host: localhost
      port: 27017
      repositories:
        enabled: true