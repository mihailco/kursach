plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.1'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation  "org.springframework.boot:spring-boot-starter:3.2.0"
    implementation  project(path: ':commons')
    implementation  "org.springframework.boot:spring-boot-starter-data-jpa:3.2.0"
    implementation  "com.auth0:java-jwt:4.3.0"
    implementation  "org.springframework.cloud:spring-cloud-starter-config"
    implementation  "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client"
    implementation  "org.projectlombok:lombok:1.18.30"
    implementation  "org.springframework.boot:spring-boot-devtools:3.1.4"
    implementation  "org.postgresql:postgresql:42.6.0"
    implementation  "org.springframework.boot:spring-boot-configuration-processor:3.1.2"
    implementation  "jakarta.validation:jakarta.validation-api:3.0.2"
    implementation  "org.hibernate.validator:hibernate-validator:8.0.1.Final"
    implementation  "org.springframework.boot:spring-boot-starter-web:3.2.0"
    implementation  "org.springframework.boot:spring-boot-test:3.2.0"

}

tasks.named('test') {
    useJUnitPlatform()
}
tasks.register("prepareKotlinBuildScriptModel"){}
